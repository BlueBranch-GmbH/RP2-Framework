name: rp2-framework

# This app only talks to the remote RP2-API over HTTPS - it has no local
# database of its own, so there's no "lamp" recipe/mysql service here.
#
# PHP 8.4 is the primary target (current, actively tested - see
# docs/05-php84-kompatibilitaet.md for what that took: the codebase itself
# was ported, not just this container). PHP 7.4 is a verified fallback - lint
# and the entry-points below ran clean on it too - in case the real hosting
# target only offers an older version. To test the fallback locally, change
# `type: php:8.4` below to `type: php:7.4` and `lando rebuild -y`.
services:
  appserver:
    type: php:8.4
    via: apache
    webroot: htdocs
    # curl, json and mbstring (required by class/api/bb.rpc.php /
    # config.default.php) already ship with Lando's php images - verified
    # via `lando php -m` on both 7.4 and 8.4, no extra build step needed.
    overrides:
      volumes:
        # Writable syslog output (config.default.php -> RPF_SYSTEM_MODULE_LOG_DIR)
        - ./logs:/app/logs

tooling:
  php:
    service: appserver

proxy:
  appserver:
    - rp2-framework.lndo.site
